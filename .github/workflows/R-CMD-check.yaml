# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
  schedule:
    - cron: '5 4 * * 1'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

name: R-CMD-check

jobs:
  R-CMD-check:
    if: "! contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # The \donttest{} examples fit models through the rstan backend.
        # rstan cannot compile a model on the macOS and Windows runners while
        # the CRAN rstan and StanHeaders are built against different Stan
        # versions, so those runners skip the examples and Linux keeps
        # running them. See #687 and #688.
        config:
          - {os: windows-latest, r: 'release', donttest: 'false'}
          - {os: ubuntu-latest,   r: 'release', donttest: 'true'}
          - {os: ubuntu-latest,   r: 'oldrel-1', donttest: 'true'}
          - {os: macOS-latest,   r: 'release', donttest: 'false'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      _R_CHECK_DONTTEST_EXAMPLES_: ${{ matrix.config.donttest }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # epireview is not on CRAN. It is installed on its own so that its
      # r-universe is never consulted for anything else.
      - name: Install epireview
        run: |
          install.packages(
            "epireview",
            repos = c("https://mrc-ide.r-universe.dev", getOption("repos"))
          )
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
