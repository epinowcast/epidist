# Rebuilds the precomputed vignettes.
#
# `ebola`, `faq`, `approx-inference` and `meta` fit models and need cmdstanr,
# so they are knitted from a `.Rmd.orig` source into a committed `.Rmd`
# holding static output. That keeps them in the package without needing
# cmdstanr, or a long model fit, at build time.
on:
  push:
    paths:
      - 'vignettes/*.Rmd.orig'
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

name: render-vignettes

jobs:
  render-vignettes:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://stan-dev.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - name: Install cmdstan
        uses: epinowcast/actions/install-cmdstan@v1
        with:
          cmdstan-version: 'latest'
          num-cores: 2

      # approx-inference uses pathfinder, which needs the path fix in
      # paul-buerkner/brms#1831. That is merged but not in a CRAN release.
      # It is only needed to generate the static output, not to build or use
      # the package, so it is installed here and nowhere else. Drop this step
      # once brms releases the fix.
      - name: Install development brms for precomputing
        run: |
          remotes::install_github(
            "paul-buerkner/brms",
            dependencies = FALSE,
            upgrade = "never"
          )
        shell: Rscript {0}

      - name: Render vignettes
        run: |
          setwd("vignettes")
          # The vignettes use bookdown::html_document2 and cross-reference
          # figures and tables with \@ref(fig:label). Outside a bookdown
          # render knitr emits a plain markdown image, which carries no
          # chunk label, so those references resolve to "??". This makes
          # knitr emit the labelled figure and caption that bookdown numbers
          # from, exactly as it would during a bookdown render.
          knitr::opts_knit$set(bookdown.internal.label = TRUE)
          for (file in list.files(pattern = "[.]Rmd[.]orig$")) {
            message("knitting ", file)
            out <- sub("[.]orig$", "", file)
            knitr::knit(file, out)
            # knitr leaves trailing whitespace in printed output, which the
            # pre-commit hooks reject.
            writeLines(sub("[ \t]+$", "", readLines(out)), out)
          }
        shell: Rscript {0}

      - name: Create pull request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: rebuild precomputed vignettes"
          title: "docs: rebuild precomputed vignettes"
          body: |
            Automated rebuild of the precomputed vignettes from their
            `.Rmd.orig` sources.
          branch: rebuild-precomputed-vignettes
          # The precomputed figures are negated out of .gitignore so a
          # plain git add can stage them. Without that this would update the
          # text and silently leave the images behind.
          add-paths: |
            vignettes/*.Rmd
            vignettes/figures
