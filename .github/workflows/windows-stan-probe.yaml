# Probes whether Stan models compile through rstan on Windows with the CRAN
# binaries, as CRAN's incoming check needs for the \donttest{} examples.
on:
  push:
    branches: [ci/windows-stan-probe]
  workflow_dispatch:

name: windows-stan-probe

jobs:
  probe:
    runs-on: windows-latest
    name: windows (${{ matrix.r }}, ${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {r: 'release', source: 'cran', rspm: 'false'}
          - {r: 'devel', source: 'cran', rspm: 'false'}
          - {r: 'release', source: 'rspm', rspm: 'true'}
          - {r: 'release', source: 'rspm-stanheaders-2.32', rspm: 'true'}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: ${{ matrix.rspm }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - name: Use the StanHeaders rstan was built against
        if: matrix.source == 'rspm-stanheaders-2.32'
        shell: Rscript {0}
        run: |
          install.packages(
            "https://cran.r-project.org/src/contrib/Archive/StanHeaders/StanHeaders_2.32.10.tar.gz",
            repos = NULL, type = "source"
          )

      - name: Compile a Stan model with rstan
        shell: Rscript {0}
        run: |
          for (p in c("rstan", "StanHeaders", "brms", "BH", "RcppEigen")) {
            v <- tryCatch(format(packageVersion(p)), error = function(e) "none")
            cat(p, v, "\n")
          }
          print(getOption("repos"))
          cat("build tools:", pkgbuild::has_build_tools(debug = TRUE), "\n")
          model <- rstan::stan_model(
            model_code = "parameters { real y; } model { y ~ normal(0, 1); }",
            verbose = TRUE
          )
          fit <- rstan::sampling(model, chains = 1, iter = 200, refresh = 0)
          print(fit)

      - name: Run the donttest examples
        shell: Rscript {0}
        run: |
          library(epidist)
          for (topic in c("epidist", "delay_summary_draws")) {
            cat("=== example", topic, "\n")
            utils::example(topic, package = "epidist", character.only = TRUE,
                           run.donttest = TRUE, ask = FALSE)
          }
