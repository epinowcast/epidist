# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
  schedule:
    - cron: '5 4 * * 1'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

name: R-CMD-as-cran-check

jobs:
  R-CMD-as-cran-check:
    if: "! contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://stan-dev.r-universe.dev https://mrc-ide.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # rstan and StanHeaders must be built against each other. The stan-dev
      # r-universe is in extra-repositories only so that cmdstanr resolves,
      # but each package is taken at its highest version wherever it lives,
      # which paired the r-universe rstan with the CRAN StanHeaders and no
      # model would compile. Reinstall the pair from CRAN, the source a CRAN
      # user gets and the one the checks should exercise. See #687 and #688.
      - name: Install rstan and StanHeaders from CRAN
        run: |
          install.packages(
            c("StanHeaders", "rstan"),
            repos = getOption("repos")[["CRAN"]]
          )
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'
