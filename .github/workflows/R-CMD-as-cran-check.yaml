# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
  schedule:
    - cron: '5 4 * * 1'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

name: R-CMD-as-cran-check

jobs:
  R-CMD-as-cran-check:
    if: "! contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://stan-dev.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check


      # `rstan` and `StanHeaders` have to be built against each other. The
      # stan-dev r-universe is in the repositories above so that `cmdstanr`
      # resolves, but it also carries an rstan newer than CRAN's, and
      # resolution takes the highest version of each package independently.
      # That pairs the r-universe rstan with the CRAN StanHeaders, which were
      # never built together, and no Stan model compiles. Take both from CRAN,
      # which is the pair users get and the one a submission is checked
      # against. See #688.
      - name: Install rstan and StanHeaders from CRAN
        run: |
          repos <- getOption("repos")
          cran <- if ("CRAN" %in% names(repos)) {
            repos[["CRAN"]]
          } else {
            "https://cloud.r-project.org"
          }
          install.packages(c("StanHeaders", "rstan"), repos = cran)
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'
