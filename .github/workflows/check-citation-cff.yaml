# Checks that the committed CITATION.cff still matches DESCRIPTION and
# inst/CITATION.
# It does not commit the result: `main` is protected, so a workflow cannot
# push to it.
# When this fails, run the Rscript from the "Regenerate CITATION.cff" step
# below and commit the file it writes.
on:
  pull_request:
    paths:
      - DESCRIPTION
      - inst/CITATION
      - CITATION.cff
      - .github/workflows/check-citation-cff.yaml
  workflow_dispatch:

name: Check CITATION.cff

permissions:
  contents: read

jobs:
  check-citation-cff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # The dependency step resolves the package's own dependencies to
          # build its cache key, and epireview is not on CRAN.
          extra-repositories: 'https://mrc-ide.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::cffr

      - name: Regenerate CITATION.cff
        run: |
          # `dependencies` and `gh_keywords` are off because both make the
          # output depend on the machine that wrote it: the first on the
          # versions of the dependencies installed there, the second on
          # whether a GitHub token was available.
          # `repository-code` is set because cffr otherwise takes it from
          # BugReports, which points at the issue tracker.
          cffr::cff_write(
            keys = list(
              "repository-code" = "https://github.com/epinowcast/epidist/"
            ),
            dependencies = FALSE,
            gh_keywords = FALSE
          )
          # cffr pads one line with a single space and ends the file with
          # a blank line. The trailing-whitespace and end-of-file-fixer
          # pre-commit hooks strip both from the committed file, so strip
          # them here too.
          lines <- sub("[[:space:]]+$", "", readLines("CITATION.cff"))
          lines <- lines[seq_len(max(which(nzchar(lines))))]
          writeLines(lines, "CITATION.cff")
        shell: Rscript {0}

      - name: Check CITATION.cff is up to date
        run: |
          if ! git diff --exit-code -- CITATION.cff; then
            echo "::error::CITATION.cff is out of date. Regenerate it with" \
              "the Rscript in .github/workflows/check-citation-cff.yaml" \
              "and commit the result."
            exit 1
          fi
