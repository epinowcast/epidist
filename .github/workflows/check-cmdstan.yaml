name: check-cmdstan

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# The Stan programs are generated from R, so a change under `R/**` can
# break the syntax of every model without touching a `.stan` file. Both
# paths therefore trigger the check.
on:
  push:
    paths:
      - '**.stan'
      - 'R/**'
    branches:
      - main
      - develop
  schedule:
    - cron: '5 4 * * 1'
  pull_request:
    paths:
      - '**.stan'
      - 'R/**'
    branches:
      - main
      - develop
  merge_group:
  workflow_dispatch:

jobs:
  check-cmdstan:
    if: "! contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: cmdstan env vars
        run: |
          echo "CMDSTAN_PATH=${HOME}/.cmdstan" >> $GITHUB_ENV
        shell: bash

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://mrc-ide.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      # cmdstanr is not a package dependency. It is installed here, on its
      # own, so that the stan-dev r-universe is never consulted for rstan or
      # StanHeaders, which must be built against each other. See #687.
      - name: Install cmdstanr
        run: |
          install.packages(
            "cmdstanr",
            repos = c("https://stan-dev.r-universe.dev", getOption("repos"))
          )
        shell: Rscript {0}

      - name: Install cmdstan
        uses: epinowcast/actions/install-cmdstan@v1
        with:
          cmdstan-version: 'latest'
          num-cores: 2

      - name: Check latent model syntax
        run: |
          dummy_obs <- dplyr::tibble(
            pdate_lwr = as.Date("2020-01-01"),
            sdate_lwr = as.Date("2020-02-01")
          )
          dummy_obs <- epidist::as_epidist_linelist_data(dummy_obs)
          dummy_obs <- epidist::as_epidist_latent_model(dummy_obs)
          stancode <- epidist::epidist(
            data = dummy_obs, fn = brms::make_stancode
          )
          mod <- cmdstanr::cmdstan_model(
            stan_file = cmdstanr::write_stan_file(stancode), compile = FALSE
          )
          message <- capture.output(
            mod$check_syntax(pedantic = FALSE),
            type = "message"
          )
          # We can't use TRUE here as pendatic check return lots of false
          # positives related to our use of functions.
          stopifnot(
            length(message) != 0 &&
            all(message == "Stan program is syntactically correct")
          )
        shell: Rscript {0}

      - name: Check marginal model syntax
        run: |
          dummy_obs <- dplyr::tibble(
            pdate_lwr = as.Date("2020-01-01"),
            sdate_lwr = as.Date("2020-02-01")
          )
          dummy_obs <- epidist::as_epidist_linelist_data(dummy_obs)
          dummy_obs <- suppressMessages(
            epidist::as_epidist_marginal_model(dummy_obs)
          )
          stancode <- epidist::epidist(
            data = dummy_obs, fn = brms::make_stancode
          )
          mod <- cmdstanr::cmdstan_model(
            stan_file = cmdstanr::write_stan_file(stancode), compile = FALSE
          )
          message <- capture.output(
            mod$check_syntax(pedantic = FALSE),
            type = "message"
          )
          stopifnot(
            length(message) != 0 &&
            all(message == "Stan program is syntactically correct")
          )
        shell: Rscript {0}

      - name: Check meta model syntax
        run: |
          estimates <- epidist::as_epidist_estimates_data(
            data.frame(
              study = c("A", "A"),
              type = c("mean", "sd"),
              value = c(7.5, 3.6),
              n = c(120, 120),
              relative_obs_time = c(20, 20),
              trunc_adjusted = c(FALSE, FALSE),
              cens_adjusted = c(0, 0)
            )
          )
          dummy_obs <- epidist::as_epidist_meta_model(estimates = estimates)
          stancode <- epidist::epidist(
            data = dummy_obs, fn = brms::make_stancode
          )
          mod <- cmdstanr::cmdstan_model(
            stan_file = cmdstanr::write_stan_file(stancode), compile = FALSE
          )
          message <- capture.output(
            mod$check_syntax(pedantic = FALSE),
            type = "message"
          )
          stopifnot(
            length(message) != 0 &&
            all(message == "Stan program is syntactically correct")
          )
        shell: Rscript {0}

      - name: Check meta model syntax on the estimated growth rate path
        run: |
          # A study that reports no growth rate leaves it to be estimated,
          # which makes the rate a parameter rather than the reported slot.
          # Every function the likelihood reaches must then stop qualifying
          # its growth rate argument as data only, which is a rejection
          # `stanc` raises and nothing else does.
          estimates <- epidist::as_epidist_estimates_data(
            data.frame(
              study = c("A", "A"),
              type = c("mean", "sd"),
              value = c(7.5, 3.6),
              n = c(120, 120),
              relative_obs_time = c(20, 20),
              trunc_adjusted = c(FALSE, FALSE),
              trunc_design = c("accrual", "accrual"),
              cens_adjusted = c(0, 0),
              growth_rate = c(NA, NA)
            )
          )
          dummy_obs <- epidist::as_epidist_meta_model(estimates = estimates)
          stopifnot("pgrowth" %in% epidist::epidist_family(dummy_obs)$dpars)
          stancode <- epidist::epidist(
            data = dummy_obs, fn = brms::make_stancode
          )
          mod <- cmdstanr::cmdstan_model(
            stan_file = cmdstanr::write_stan_file(stancode), compile = FALSE
          )
          message <- capture.output(
            mod$check_syntax(pedantic = FALSE),
            type = "message"
          )
          stopifnot(
            length(message) != 0 &&
            all(message == "Stan program is syntactically correct")
          )
        shell: Rscript {0}

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Stan syntax check failed on scheduled run';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stan-check-failure'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: [
                  'The weekly `check-cmdstan` workflow failed.',
                  '',
                  'This likely means an upstream dependency ' +
                  '(e.g. primarycensored) changed its Stan ' +
                  'function signatures.',
                  '',
                  `Run: ${context.serverUrl}/${context.repo.owner}` +
                  `/${context.repo.repo}/actions/runs` +
                  `/${context.runId}`,
                  '',
                  'This was opened by a bot. Please ping ' +
                  '@seabbs for any questions.'
                ].join('\n'),
                labels: ['stan-check-failure']
              });
            }
