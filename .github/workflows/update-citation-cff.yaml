# Regenerates CITATION.cff with cffr and opens a pull request if it changed.
#
# The action runs when:
# - DESCRIPTION, inst/CITATION or this workflow change on main
# - It is run manually
#
# CITATION.cff is built from DESCRIPTION and inst/CITATION only.
# Dependencies are left out so the file does not change with the versions
# installed on the runner.
# To regenerate it locally run the R code in the "Update CITATION.cff" step.
on:
  push:
    branches: [main]
    paths:
      - DESCRIPTION
      - inst/CITATION
      - .github/workflows/update-citation-cff.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Update CITATION.cff

jobs:
  update-citation-cff:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::cffr
            any::V8

      - name: Update CITATION.cff
        run: |
          cffr::cff_write(
            keys = list(
              "repository-code" = "https://github.com/epinowcast/epidist"
            ),
            dependencies = FALSE,
            gh_keywords = FALSE
          )
          # cffr leaves trailing whitespace and a trailing blank line, which
          # the pre-commit hooks reject.
          cff <- sub("[ \t]+$", "", readLines("CITATION.cff"))
          while (!nzchar(cff[length(cff)])) cff <- cff[-length(cff)]
          writeLines(cff, "CITATION.cff")
        shell: Rscript {0}

      - name: Create pull request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update CITATION.cff"
          title: "Update CITATION.cff"
          body: |
            Automated update of `CITATION.cff` from `DESCRIPTION` and
            `inst/CITATION`.
          branch: update-citation-cff
          reviewers: seabbs
          add-paths: |
            CITATION.cff
          token: ${{ secrets.GITHUB_TOKEN }}
